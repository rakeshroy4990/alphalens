spring.application.name=alphalens-backend
# Cloud Run sets PORT for nginx. Java must stay on BACKEND_PORT.
server.port=${BACKEND_PORT:${PORT:8088}}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Accepts jdbc:postgresql://, postgresql://, or postgres://.
# {{password}} in the URL is replaced from SPRING_DATASOURCE_PASSWORD.
# Port 6543 (Supabase transaction pooler) disables prepared statements automatically.
# Never put the Supabase anon or service_role key in the Vue app.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alphalens}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alphalens}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alphalens}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.data-source-properties.prepareThreshold=${app.datasource.prepare-threshold:5}

app.supabase.url=${SUPABASE_URL:}
app.datasource.transaction-pooler=${DATASOURCE_TRANSACTION_POOLER:false}
app.datasource.prepare-threshold=${DATASOURCE_PREPARE_THRESHOLD:5}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:0}

spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.web.app,https://*.firebaseapp.com,https://*.run.app}

# JWT + httpOnly cookies. Set APP_AUTH_JWT_SECRET in production. Never put secrets in Vue.
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:change-this-jwt-secret-min-32-bytes}
app.auth.jwt.access-expiration-seconds=${APP_AUTH_JWT_ACCESS_EXPIRATION_SECONDS:43200}
app.auth.jwt.refresh-expiration-seconds=${APP_AUTH_JWT_REFRESH_EXPIRATION_SECONDS:2592000}
app.auth.jwt.issuer=${APP_AUTH_JWT_ISSUER:alphalens-backend}
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.domain=${APP_AUTH_COOKIE_DOMAIN:}
app.auth.cookie.cross-site-deployment=${APP_AUTH_COOKIE_CROSS_SITE_DEPLOYMENT:false}
app.auth.cookie.refresh-max-age-seconds=${APP_AUTH_COOKIE_REFRESH_MAX_AGE_SECONDS:2592000}
app.auth.cookie.access-max-age-seconds=${APP_AUTH_COOKIE_ACCESS_MAX_AGE_SECONDS:43200}
app.auth.cookie.access-token-name=${APP_AUTH_COOKIE_ACCESS_TOKEN_NAME:access_token}
app.auth.public-path-prefixes=/api/auth/login,/api/auth/register,/api/auth/google-login,/api/auth/refresh,/api/auth/logout,/api/auth/change-password,/api/auth/client-config,/api/health,/api/instruments,/api/research,/api/screener,/error
app.auth.password.min-length=${APP_AUTH_PASSWORD_MIN_LENGTH:10}
app.auth.password.require-mixed-character-classes=${APP_AUTH_PASSWORD_REQUIRE_MIXED:true}
app.google.oauth.web-client-id=${APP_GOOGLE_OAUTH_WEB_CLIENT_ID:}
