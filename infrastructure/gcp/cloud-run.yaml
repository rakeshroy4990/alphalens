# Deploy after the image exists in Artifact Registry.
#   gcloud run services replace infrastructure/gcp/cloud-run.yaml --region=asia-south1 --project=alphalens-508509
#
# Set SPRING_DATASOURCE_* from Secret Manager in production.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: alphalens
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - name: alphalens
          image: asia-south1-docker.pkg.dev/alphalens-508509/alphalens/alphalens:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: BACKEND_PORT
              value: "8088"
            - name: SPRING_DATASOURCE_URL
              value: postgresql://postgres:{{password}}@db.nbityfnkiavbzkkacaxm.supabase.co:5432/postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: SPRING_DATASOURCE_PASSWORD
                  key: latest
            - name: SPRING_DATASOURCE_MAX_POOL_SIZE
              value: "5"
            - name: APP_CORS_ALLOWED_ORIGIN_PATTERNS
              value: https://*.run.app,http://localhost:*
            - name: APP_AUTH_COOKIE_SECURE
              value: "true"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
