# Build and push the AlphaLens Cloud image to Artifact Registry.
# Prerequisites: Artifact Registry repo `alphalens` in $LOCATION.
#
#   gcloud builds submit --project=alphalens-508509 --config=cloudbuild.yaml \
#     --substitutions=_LOCATION=asia-south1,_REPOSITORY=alphalens,_IMAGE=alphalens

substitutions:
  _LOCATION: asia-south1
  _REPOSITORY: alphalens
  _IMAGE: alphalens

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 40

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --platform=linux/amd64
      - --file=infrastructure/gcp/Dockerfile
      - --tag=${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${COMMIT_SHA}
      - --tag=${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
      - .

images:
  - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${COMMIT_SHA}
  - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest
